<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PROBABLY — A Detective in Probabilities</title>
<link rel="icon" type="image/png" href="assets/icon-32.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#070d18; }
  body {
    font-family:"M PLUS Rounded 1c", sans-serif;
    color:#f2ead8;
    max-width:480px; margin:0 auto; min-height:100vh;
    background:linear-gradient(180deg,#0a1322 0%,#0d1830 60%,#0a1322 100%);
    padding:16px 14px 40px;
    -webkit-text-size-adjust:100%;
  }
  .screen { display:none; }
  .screen.on { display:block; }

  /* タイトル画面 */
  #scr-title { text-align:center; padding-top:12px; }
  #scr-title img.logo { width:100%; height:auto; border-radius:10px; box-shadow:0 6px 30px rgba(0,0,0,.6); }
  .start-wrap { margin-top:22px; text-align:center; }
  .ver { margin-top:18px; color:#8fa3c8; font-size:12px; letter-spacing:.15em; }

  /* ボタン共通：枠いっぱい・左詰め・折り返しなし */
  button {
    font-family:inherit; cursor:pointer; color:#f2ead8;
    background:#16233d; border:1px solid #35507e; border-radius:8px;
    width:100%; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    padding:13px 14px; font-size:16px; margin-top:10px;
  }
  button:active { background:#1e3054; }
  button:disabled { opacity:.38; cursor:default; }
  button.accent { background:#6d4420; border-color:#d99a4e; color:#ffe9c9; }
  button.accent:active { background:#855628; }
  button.ghost { background:transparent; border-color:#2a3c5f; color:#aebedd; }
  #accuse-list button.selected { background:#6d4420; border-color:#d99a4e; color:#ffe9c9; }
  button.start {
    width:auto; text-align:center; font-size:19px; padding:14px 42px;
    background:#6d4420; border:1px solid #d99a4e; color:#ffe9c9; border-radius:10px;
  }

  h2.case-title { font-size:20px; font-weight:700; color:#ffd9a0; margin:4px 0 8px; letter-spacing:.03em; }
  .sub { color:#aebedd; font-size:13px; line-height:1.7; }
  .intro { background:rgba(255,255,255,.045); border:1px solid #26395e; border-radius:8px; padding:12px 13px; font-size:14px; line-height:1.85; margin-top:10px; }

  /* 調査画面 */
  .hud { display:flex; justify-content:space-between; align-items:baseline; margin-top:6px; }
  .hud .time { font-size:17px; color:#ffd9a0; }
  .hud .time.low { color:#ff9a8a; }
  .timebar { height:8px; background:#101b31; border:1px solid #26395e; border-radius:4px; margin-top:6px; overflow:hidden; }
  .timebar > div { height:100%; background:linear-gradient(90deg,#d99a4e,#f3c078); transition:width .5s ease; }
  .sec-label { margin-top:20px; font-size:13px; color:#8fa3c8; letter-spacing:.2em; }
  .suspect { background:rgba(255,255,255,.045); border:1px solid #26395e; border-radius:8px; padding:10px 12px; margin-top:8px; }
  .suspect .row { display:flex; justify-content:space-between; align-items:baseline; }
  .suspect .name { font-size:16px; font-weight:700; }
  .suspect .role { color:#8fa3c8; font-size:12px; margin-left:8px; }
  .suspect .pct { font-size:17px; font-weight:700; color:#ffd9a0; }
  .suspect.top { border-color:#d99a4e; }
  .suspect .intro-s { color:#c6d2e8; font-size:12.5px; line-height:1.7; margin-top:5px; }
  .bar { height:12px; background:#101b31; border-radius:6px; margin-top:7px; overflow:hidden; }
  .bar > div { height:100%; background:linear-gradient(90deg,#7d9cc9,#a8c4ea); transition:width .7s ease; }
  .suspect.top .bar > div { background:linear-gradient(90deg,#d99a4e,#ffd9a0); }

  .ev-got { background:rgba(217,154,78,.08); border:1px solid #6d5426; border-radius:8px; padding:11px 13px; margin-top:10px; }
  .ev-got .ev-name { font-size:15px; color:#ffd9a0; }
  .ev-got .ev-text { font-size:13.5px; line-height:1.85; color:#e8e0cc; margin-top:6px; }
  .ev-got .ev-gain { font-size:13px; color:#9db8e8; margin-top:5px; }
  .ev-min { color:#8fa3c8; font-size:12.5px; }

  /* 結果 */
  .result-head { font-size:24px; font-weight:700; margin-top:8px; }
  .result-head.ok { color:#ffd9a0; }
  .result-head.ng { color:#ff9a8a; }
  .scorebox { background:rgba(255,255,255,.045); border:1px solid #26395e; border-radius:8px; padding:12px 13px; margin-top:12px; font-size:15px; line-height:2; }
  .scorebox .rank { font-size:26px; color:#ffd9a0; }
  .best { color:#8fa3c8; font-size:13px; margin-top:8px; }
</style>
</head>
<body>

<!-- タイトル画面 -->
<div id="scr-title" class="screen on">
  <img class="logo" src="assets/logo-probably.jpg" alt="PROBABLY — A Detective in Probabilities">
  <div class="start-wrap"><button class="start" id="btn-start">調査をはじめる</button></div>
  <div class="ver">PROBABLY v1.8</div>
</div>

<!-- 事件選択 -->
<div id="scr-cases" class="screen">
  <h2 class="case-title">事件ファイル</h2>
  <div class="sub">証拠を集めると、容疑者それぞれの「犯人である確率」が動く。制限時間の中で集める証拠を選び、確信が持てたら名指しする。</div>
  <div id="case-list"></div>
  <button class="ghost" id="btn-to-title">タイトルへ戻る</button>
</div>

<!-- 調査画面 -->
<div id="scr-play" class="screen">
  <h2 class="case-title" id="play-title"></h2>
  <div class="hud"><span class="sub" id="deadline-reason"></span><span class="time" id="time-left"></span></div>
  <div class="timebar"><div id="time-fill" style="width:100%"></div></div>
  <div id="entropy-row" style="display:none">
    <div class="hud"><span class="sub">不確実さ（エントロピー）</span><span class="time" id="entropy-val"></span></div>
    <div class="timebar"><div id="entropy-fill" style="width:100%;background:linear-gradient(90deg,#4e7ad9,#78a8f3)"></div></div>
  </div>
  <div class="intro" id="play-intro"></div>
  <div class="sec-label">容疑者 ― 犯人である確率</div>
  <div id="suspects"></div>
  <div class="sec-label">証拠を集める</div>
  <div id="evidences"></div>
  <button class="accent" id="btn-accuse">名指しする</button>
  <button class="ghost" id="btn-quit">事件を諦める（選択へ戻る）</button>
</div>

<!-- 名指し画面 -->
<div id="scr-accuse" class="screen">
  <h2 class="case-title">誰を名指しする？</h2>
  <div class="sub">一度名指ししたら取り消せない。誤認は大きな減点になる。</div>
  <div id="accuse-list"></div>
  <button class="ghost" id="btn-back-play">調査へ戻る</button>
</div>

<!-- 結果画面 -->
<div id="scr-result" class="screen">
  <div class="result-head" id="result-head"></div>
  <div class="intro" id="result-text"></div>
  <div class="sec-label">最終的な確率</div>
  <div id="result-suspects"></div>
  <div class="scorebox" id="scorebox"></div>
  <button class="accent" id="btn-to-cases">事件ファイルへ</button>
  <button class="ghost" id="btn-retry">この事件をやり直す</button>
</div>

<script>
"use strict";
// ===== 台本データ（事件JSONと同一内容。検証は verify-case.mjs で実施） =====
const CASES = [
{
  "id": "case-001",
  "title": "雨の夜、消えた売上金",
  "difficulty": 1,
  "intro": "商店街の小さなバー「灯」。雨の夜、閉店間際に突然の停電が起きた。電気が戻ったとき、レジ横に置いてあった売上金の封筒が消えていた。その夜、店の中にいたのは3人だけ。朝になれば酒屋の回収便が来て、空の瓶ケースは全部持っていかれてしまう。それまでに、誰が取ったのかを名指ししなければならない。",
  "deadline": { "minutes": 150, "reason": "朝の回収便が瓶ケースを持ち去るまで" },
  "culprit": "saeki",
  "solution": "決め手は瓶ケースだ。売上金は朝の回収便で運び出すために、空の瓶ケースに隠されていた。それを扱えるのは配達員の佐伯だけだ。ブレーカーを落として暗闇を作り、裏口からレジ裏へ――足跡も、エンジン音も、全部つながる。高木には動機があったし、三島の指紋もあった。だが確率が指し示したのは、最初からずっと、佐伯だった。",
  "suspects": [
    { "id": "takagi", "name": "高木 蓮", "role": "バーの見習い店員", "intro": "働き始めて半年の若手。手際はいいが、最近元気がない。店の裏口や配電盤の場所は知っている。", "prior": 0.3333 },
    { "id": "mishima", "name": "三島 圭", "role": "常連客", "intro": "毎晩のように来る常連。停電のとき「トイレに行っていた」と言う。以前、忙しい日にレジ打ちを手伝ったことがある。", "prior": 0.3333 },
    { "id": "saeki", "name": "佐伯 徹", "role": "酒屋の配達員", "intro": "その夜、閉店前に酒を届けに来た。配達ではいつも裏口を使い、空の瓶ケースを回収していく。", "prior": 0.3334 }
  ],
  "evidences": [
    { "id": "ev-breaker", "name": "落とされたブレーカー", "minutes": 30, "text": "配電盤を見ると、ブレーカーは故障ではなく、人の手で落とされた形跡があった。停電は偶然ではない。誰かが暗闇を必要とした。ブレーカーの場所を知っているのは、店に出入りする人間だけだ。", "likelihoods": { "takagi": 0.4, "mishima": 0.1, "saeki": 0.7 } },
    { "id": "ev-footprints", "name": "裏口からの濡れた足跡", "minutes": 40, "text": "裏口からレジ裏まで、濡れた足跡が続いていた。雨の中を外から来て、裏口を通った者の足跡だ。表の客席側には、こんな足跡はない。", "likelihoods": { "takagi": 0.2, "mishima": 0.15, "saeki": 0.75 } },
    { "id": "ev-debt", "name": "高木のスマホの督促メッセージ", "minutes": 20, "text": "高木のスマホには、借金の督促メッセージが何通も届いていた。金に困っているのは確かだ。だが、動機があることと、やったことは、別の話だ。", "likelihoods": { "takagi": 0.7, "mishima": 0.2, "saeki": 0.2 } },
    { "id": "ev-bottlecase", "name": "重すぎる瓶ケース", "minutes": 50, "text": "回収予定の空の瓶ケースのうち1箱だけ、やけに重い。中を改めると、瓶の間に売上金の封筒が隠してあった。朝の回収便で、そのまま店の外へ運び出すつもりだったらしい。", "likelihoods": { "takagi": 0.1, "mishima": 0.05, "saeki": 0.85 } },
    { "id": "ev-engine", "name": "停電の瞬間のエンジン音", "minutes": 30, "text": "向かいの店の主人が言うには、停電の直前、店の裏手で車のエンジンがかかる音がした。裏の路地に車を停められるのは、配達の車くらいだ。", "likelihoods": { "takagi": 0.2, "mishima": 0.1, "saeki": 0.6 } },
    { "id": "ev-fingerprint", "name": "レジの引き出しの指紋", "minutes": 40, "text": "レジの引き出しから三島の指紋が出た。だが三島は以前、忙しい日にレジ打ちを手伝ったことがある。指紋があること自体は、あの夜に触った証拠にはならない。", "likelihoods": { "takagi": 0.2, "mishima": 0.55, "saeki": 0.15 } }
  ]
},
{"culprit":"todo","deadline":{"minutes":180,"reason":"夜勤スタッフが退館する朝6時の交代まで"},"difficulty":2,"evidences":[{"id":"ev-fingerprint2","likelihoods":{"kanda":0.2,"nishimura":0.75,"ono":0.15,"todo":0.1},"minutes":30,"name":"試作機ケースの指紋","text":"試作機ケースの留め具から、西村の指紋が出た。だが西村はその日の夕方、試作機をケースに収めた本人だ。指紋があって当然の場所だった。"},{"id":"ev-mail","likelihoods":{"kanda":0.65,"nishimura":0.2,"ono":0.1,"todo":0.15},"minutes":30,"name":"神田の転職メール","text":"神田の送信履歴に、競合他社の人事宛てのメールがあった。転職活動は本当らしい。だが試作機とは関係のない、数週間前から続くやり取りだった。"},{"id":"ev-keylog","likelihoods":{"kanda":0.05,"nishimura":0.05,"ono":0.3,"todo":0.8},"minutes":40,"name":"マスターキーの使用記録","text":"保管室の電子錠は、深夜2時13分にマスターキーで開けられていた。その夜、マスターキーを預かっているのは夜間警備の藤堂だけだ。"},{"id":"ev-camera","likelihoods":{"kanda":0.1,"nishimura":0.1,"ono":0.5,"todo":0.75},"minutes":50,"name":"防犯カメラの死角","text":"フロアの防犯カメラには、深夜、保管室の前を通る人影が映っていなかった。犯人はカメラの死角になる非常階段側の動線を使ったらしい。その死角の位置を知っているのは、巡回する警備員と、裏動線を使う清掃スタッフくらいだ。"},{"id":"ev-patrolgap","likelihoods":{"kanda":0.1,"nishimura":0.1,"ono":0.15,"todo":0.85},"minutes":40,"name":"巡回記録の空白17分","text":"藤堂の巡回記録には、2時05分から2時22分まで、17分間の空白がある。本人は「仮眠していた」と言う。"},{"id":"ev-glove","likelihoods":{"kanda":0.1,"nishimura":0.1,"ono":0.55,"todo":0.4},"minutes":30,"name":"裏口のゴミ箱の手袋","text":"裏口のゴミ箱に、使い捨ての薄手手袋が捨ててあった。清掃用にも見えるが、サイズは大きめで、内側には汗の跡があった。"},{"id":"ev-badge","likelihoods":{"kanda":0.35,"nishimura":0.05,"ono":0.4,"todo":0.5},"minutes":20,"name":"入館バッジの記録","text":"入館バッジの記録では、西村は23時07分に退館している。試作機が消えたのは深夜2時前後だ。ただしバッジの貸し借りまでは、記録には残らない。"}],"id":"case-002","intro":"デザイン事務所「スタジオ・ノルド」の発表前夜。翌朝の発表会で披露するはずの新型端末の試作機が、保管室から消えた。電子錠はマスターキーで開けられ、防犯カメラには何も映っていない。午前3時、その夜ビルにいたのは4人だけだった。夜勤スタッフは午前6時の交代で帰ってしまう。それまでに、誰が持ち出したのかを名指ししなければならない。","solution":"決め手は、マスターキーと巡回記録の空白だ。保管室を開けられたのは藤堂だけで、カメラの死角を知っていたのも藤堂だった。空白の17分のあいだに非常階段を抜け、手袋をして試作機を持ち出した。西村の指紋は夕方の作業のもの、神田のメールはただの転職活動だった。最初に目につく証拠ほど、当てにはならない。","suspects":[{"id":"nishimura","intro":"試作機の組み立てを担当した若手。夕方、試作機をケースに収めて保管室に入れた。最近、別のプロジェクトへ異動の噂がある。","name":"西村 翔","prior":0.25,"role":"後輩エンジニア"},{"id":"ono","intro":"夜間の清掃を一人で担当している。フロアの鍵を持ち、裏動線を隅々まで知っている。","name":"大野 敏江","prior":0.25,"role":"夜間清掃スタッフ"},{"id":"kanda","intro":"試作機プロジェクトの責任者。発表会の準備で深夜まで残っていた。競合他社への転職が噂されている。","name":"神田 玲子","prior":0.25,"role":"プロジェクトマネージャー"},{"id":"todo","intro":"その夜の警備を一人で担当。マスターキーを預かり、ビルの巡回路とカメラの位置を把握している。","name":"藤堂 厳","prior":0.25,"role":"夜間警備員"}],"title":"発表前夜、消えた試作機"},
{"culprit":"kobayashi","deadline":{"minutes":170,"reason":"朝の出荷トラックが出発するまで"},"difficulty":3,"evidences":[{"id":"ev-sighting","likelihoods":{"iwasaki":0.15,"kobayashi":0.1,"kuroda":0.7,"miura":0.2},"minutes":20,"name":"裏門付近の目撃証言","text":"別棟の夜勤清掃員が言うには、事件の夜、裏門の近くで黒田に似た男を見た。暗がりで、顔までははっきりしなかったという。"},{"id":"ev-alibi","likelihoods":{"iwasaki":0.4,"kobayashi":0.45,"kuroda":0.05,"miura":0.4},"minutes":40,"name":"黒田のアリバイ","text":"黒田は事件の時刻、隣町のコンビニにいた。レシートと防犯映像の両方が残っている。その足で実家に帰り、夜通し家にいたことも家族が証言した。"},{"id":"ev-ledger","likelihoods":{"iwasaki":0.2,"kobayashi":0.85,"kuroda":0.1,"miura":0.1},"minutes":50,"name":"在庫帳簿の食い違い","text":"在庫の帳簿を実数と突き合わせると、消えた24本以外にも、数か月前から少しずつ本数が合っていなかった。帳簿を日常的に触れるのは、経理の小林だけだ。"},{"id":"ev-keycard","likelihoods":{"iwasaki":0.6,"kobayashi":0.55,"kuroda":0.2,"miura":0.15},"minutes":30,"name":"倉庫の入退室記録","text":"犯行時刻の前後、倉庫のカード記録に残っているのは岩崎と小林の2人だけだった。"},{"id":"ev-tire","likelihoods":{"iwasaki":0.2,"kobayashi":0.15,"kuroda":0.25,"miura":0.65},"minutes":30,"name":"裏門のタイヤ痕","text":"裏門の泥に、新しいタイヤ痕があった。三浦の配送トラックとタイヤの型が一致した。だがそのトラックは毎朝、裏門から入って荷を積むのが決まりだ。"},{"id":"ev-phone","likelihoods":{"iwasaki":0.15,"kobayashi":0.7,"kuroda":0.1,"miura":0.3},"minutes":30,"name":"小林の深夜の通話履歴","text":"事件の夜、小林の携帯から、市内の酒販ブローカーの番号へ2回の発信があった。本人は「間違い電話だった」と言う。"},{"id":"ev-shift","likelihoods":{"iwasaki":0.55,"kobayashi":0.3,"kuroda":0.15,"miura":0.2},"minutes":20,"name":"岩崎の残業記録","text":"岩崎は事件の夜、在庫の棚卸しで一人、遅くまで残っていた。本人の申告どおり、入退室の記録も残っている。"}],"id":"case-003","intro":"港の倉庫街。輸入ウイスキーを扱う倉庫から、高額な限定ボトル24本が消えた。真っ先に疑われたのは、先月解雇された元従業員の黒田だ。会社への恨みがあり、事件の夜には倉庫の裏で目撃もされている。だが、疑いと事実は同じではない。朝になれば出荷トラックが出て、残りの積み荷は市内へ散ってしまう。それまでに、名指ししなければならない。","solution":"決め手は帳簿だ。盗みはあの夜一晩の出来事ではなかった。数か月かけて少しずつ本数をずらし、帳簿を触れる小林が、最後に24本をまとめて持ち出した。深夜のブローカーへの電話が、その行き先だった。黒田は最初から一番怪しく見えた。だがアリバイは本物だった。確率は、印象ではなく証拠で動かすものだ。","suspects":[{"id":"kuroda","intro":"先月、勤務態度を理由に解雇された。「会社には恨みがある」と本人も認めている。事件の夜、倉庫の裏門付近で目撃されている。","name":"黒田 修","prior":0.45,"role":"元従業員"},{"id":"iwasaki","intro":"勤続20年の現場班長。事件の夜は棚卸しで遅くまで残っていた。倉庫のことなら何でも知っている。","n 事件が教えてくれたことがある。明朝の開幕内覧で報道陣が入れば、事件は表沙汰になり、スケッチは二度と戻らない。それまでに、名指ししなければならない。","solution":"決め手は目録の書き換えだ。スケッチは「複製」に化けさせて持ち出す手口だった。目録を触れたのは倉本だけで、美術商への連絡がその行き先を物語る。佐川は最初から一番怪しく見えた。だが口論も前科の噂も、証拠ではなかった。確率は、印象ではなく証拠でだけ動かすものだ。","suspects":[{"id":"sagawa","intro":"その日、警備員と口論になった。若い頃の前科の噂があり、真っ先に疑われている。本人は「金目のものには触っていない」と言う。","name":"佐川 武","prior":0.35,"role":"運送会社の搬入作業員"},{"id":"bessho","intro":"館の鍵と巡回を一人で担う。佐川と揉めた当人でもある。","name":"別所 徹","prior":0.2,"role":"夜間警備員"},{"id":"kuramoto","intro":"搬入された作品の目録を担当。スケッチの来歴と本当の価値を、誰より詳しく知っている。","name":"倉本 怜","prior":0.15,"role":"若手学芸員"},{"id":"arima","intro":"作品の保険と貸出条件を仕切る。評価額の動きに敏感だ。","name":"有馬 沙織","prior":0.15,"role":"貸主コレクターの代理人"},{"id":"godo","intro":"特別展の責任者。収蔵庫の鍵を持ち、館の信用を背負っている。","name":"郷田 真一","prior":0.15,"role":"ベテラン学芸員"}],"title":"開幕前夜、消えた未公開スケッチ"},
{"culprit":"otowa","deadline":{"minutes":140,"reason":"開演時刻"},"difficulty":6,"evidences":[{"id":"ev-witness","likelihoods":{"takamine":0.15,"otowa":0.15,"kirishima":0.9,"kohinata":0.15},"minutes":20,"name":"常連客の目撃証言","text":"常連客が「開演の1時間ほど前、店主がギターケースを持って裏口から出るのを見た」と証言した。目撃者は自信たっぷりで、店内は店主への疑いでざわついている。"},{"id":"ev-register","likelihoods":{"kirishima":0.25,"kohinata":1,"otowa":1,"takamine":1},"minutes":20,"name":"店主のレジ記録と受付メモ","text":"目撃された時刻、店主は受付でチケットをもぎり、レジ記録も連続していた。店主が裏口へ行く時間はなかったと分かる。証言の時刻か、人物のどちらかが間違っている。"},{"id":"ev-camera","likelihoods":{"takamine":0.13,"otowa":1,"kirishima":0.11,"kohinata":0.19},"minutes":40,"name":"裏口の防犯カメラ（時刻ずれの確認込み）","text":"カメラの時計は10分進んでいた。そのずれを直して目撃証言の時刻と重ねると、ケースを持ち出していたのは店主ではなく音羽だった。映像の人物は背格好も店主とは違う。証言は「人違い」だった。"},{"id":"ev-pick","likelihoods":{"takamine":0.32,"otowa":1,"kirishima":0.32,"kohinata":0.41},"minutes":25,"name":"楽屋に落ちていたピック","text":"ギターがあった場所の近くに、特注のピックが落ちていた。持ち主は音羽。自分のピックを他人の楽屋に落とすのは、そこへ入り込んだ何よりの痕跡だ。"},{"id":"ev-fingerprint","likelihoods":{"takamine":0.21,"otowa":1,"kirishima":0.25,"kohinata":0.67},"minutes":45,"name":"ギターケースの指紋","text":"回収された空のケースから指紋を取ると、小日向のものと音羽のものが出た。小日向の指紋は搬入作業で付いた可能性があるが、音羽がケースに触れる理由は見当たらない。"},{"id":"ev-sns","likelihoods":{"takamine":0.23,"otowa":1,"kirishima":0.27,"kohinata":0.27},"minutes":30,"name":"来場者が投稿した写真","text":"開演前に投稿された楽屋裏の写真の隅に、音羽のアンプケースが写っている。ケースの形が不自然に膨らんでいて、中にギターが入っているように見える。"},{"id":"ev-motive","likelihoods":{"takamine":0.67,"otowa":1,"kirishima":0.72,"kohinata":0.33},"minutes":25,"name":"対バンの確執（関係者の話）","text":"音羽は「今夜の客入りで負けたら、来月のブッキングは向こうのものになる」と漏らしていた。ギターが消えて公演が潰れれば、得をするのは音羽のバンドだ。"}],"id":"case-006","intro":"ライブハウス「月夜」。今夜の公演の目玉、出演バンドのボーカルが使う高価なヴィンテージギターが、開演前の楽屋から消えた。常連客が「店主がギターケースを持ち出すのを見た」と証言し、店主が真っ先に疑われている。だが証言は、強いからといって正しいとは限らない。開演までに見つからなければ公演は中止、払い戻しの騒ぎになる。それまでに名指ししなければならない。","solution":"犯人は対バンのギタリスト、音羽 徹。常連客の証言は自信に満ちていたが人違いで、裏口のカメラの時刻ずれを正すと、ケースを持ち出していたのは音羽だった。楽屋に落ちた特注ピックと、不自然に膨らんだアンプケースの写真がそれを裏づける。動機は対バンでの客入り争い——公演を潰せば来月のブッキングが自分のものになった。この事件の教訓は、証言は強く響いても裏取りが要るということ。確率が一つの証言で大きく跳ねたら、それが間違っていた場合の裏づけも同じだけ探すことだ。","suspects":[{"id":"takamine","intro":"消えたギターの持ち主。自分の楽器への愛着は人一倍で、保険の話をやたらと気にする。","name":"高嶺 響","prior":0.25,"role":"出演バンドのボーカル"},{"id":"otowa","intro":"今夜の対バンドのギタリスト。高嶺とはデビュー前からのライバルで、客入りで負けるのを嫌っている。","name":"音羽 徹","prior":0.25,"role":"対バンのギタリスト"},{"id":"kirishima","intro":"店の経営者。常連客に「ケースを持ち出すのを見た」と証言され、真っ先に疑われている。","name":"霧島 蓮","prior":0.25,"role":"ライブハウスの店主"},{"id":"kohinata","intro":"機材の搬入と設営を担当するバイト。楽屋への出入りが多く、ギターにも触れている。","name":"小日向 葵","prior":0.25,"role":"設営スタッフ（アルバイト）"}],"title":"ライブ直前、消えたギター"},
{"culprit":["makabe","kurosawa"],"deadline":{"minutes":150,"reason":"明朝、貸主の宝石商が検品に来るまで"},"difficulty":7,"evidences":[{"id":"ev-call7","likelihoods":{"ayase":0.25,"kurosawa":0.8,"makabe":0.8,"nikaido":0.4,"okouchi":0.3},"minutes":25,"name":"真壁と黒沢の通話履歴","text":"この1週間、真壁と黒沢は毎日のように電話で話していた。仕事の連絡にしては回数が多すぎ、時間も深夜に偏っている。2人の「つながり」を示す証拠だ。"},{"id":"ev-swap7","likelihoods":{"ayase":0.2,"kurosawa":0.55,"makabe":0.9,"nikaido":0.45,"okouchi":0.25},"minutes":35,"name":"すり替えの鑑定結果","text":"戻ってきた「宝石」は精巧な模造品だった。本物と入れ替わったのは、撮影の数日前から最終日のあいだ。宝石を単独で扱えたのは、小道具係の真壁だけだ。"},{"id":"ev-crate7","likelihoods":{"ayase":0.2,"kurosawa":0.9,"makabe":0.55,"nikaido":0.35,"okouchi":0.25},"minutes":30,"name":"木箱の重量の食い違い","text":"最終日に黒沢のトラックで運び出された小道具の木箱は、搬入時の記録より1.2キロ重かった。中に何か、余計なものが入っていた計算になる。"},{"id":"ev-key7","likelihoods":{"ayase":0.25,"kurosawa":0.5,"makabe":0.85,"nikaido":0.75,"okouchi":0.3},"minutes":25,"name":"小道具部屋の鍵の貸出記録","text":"宝石が保管されていた小道具部屋の鍵は、この数日、真壁と二階堂が借りていた。衣装の出し入れという理由は、二階堂については記録と一致する。"},{"id":"ev-actor7","likelihoods":{"ayase":0.75,"kurosawa":0.25,"makabe":0.25,"nikaido":0.3,"okouchi":0.3},"minutes":20,"name":"綾瀬の目撃証言","text":"スタッフの一人が「最終日の夕方、小道具部屋の前で綾瀬を見た」と証言した。主演俳優が小道具部屋に用があるはずはなく、現場はざわついている。"},{"id":"ev-debt7","likelihoods":{"ayase":0.25,"kurosawa":0.8,"makabe":0.35,"nikaido":0.3,"okouchi":0.3},"minutes":25,"name":"黒沢の借金と不審な入金","text":"黒沢には運送の売り上げとは釣り合わない借金があり、最終日の夜、現金で一部が返済されていた。出所を聞かれると、言葉を濁した。"},{"id":"ev-schedule7","likelihoods":{"ayase":0.3,"kurosawa":0.3,"makabe":0.3,"nikaido":0.3,"okouchi":0.7},"minutes":30,"name":"撮影順の変更メモ","text":"最終日の撮影順は、大河内の指示で直前に変更されていた。宝石の登場シーンが後ろ倒しになり、すり替えに気づくのが遅れた形だ。ただし変更の理由自体は、天候待ちというまっとうなものだった。"},{"id":"ev-fiber7","likelihoods":{"ayase":0.2,"kurosawa":0.5,"makabe":0.85,"nikaido":0.4,"okouchi":0.2},"minutes":35,"name":"偽物の箱の繊維","text":"模造品が入っていた箱の内側に、小道具部屋の作業台の布と同じ繊維が付着していた。箱詰めの作業は、小道具係の持ち場で行われたとみられる。"}],"id":"case-007","intro":"映画の撮影現場、最終日。本物の宝石を使うクライマックスの撮影を終え、貸主へ返却する段になって、宝石が精巧な模造品にすり替わっていることが分かった。手口から見て、犯行は一人では成り立たない。内部で宝石を扱える人間と、撮影所の外へ運び出せる人間——2人の共犯がいるはずだ。明朝、貸主の宝石商が検品に来る。それまでに、2人を名指ししなければならない。","solution":"犯人は小道具係の真壁 誠と、運送業者の黒沢 仁の2人。真壁が撮影の合間に本物を模造品とすり替え、黒沢が小道具の木箱に隠して撮影所の外へ運び出した。決め手は、2人のあいだの毎夜の通話履歴という「つながり」の証拠だ。片方だけを追う証拠では、共犯は半分しか見えない。綾瀬の目撃も、撮影順の変更も、それぞれ別の理由があった。この事件の教訓は、共犯の事件では「誰が怪しいか」と同じだけ「誰と誰がつながっているか」を集めることだ。","suspects":[{"id":"makabe","intro":"宝石の管理を一手に担う。扱いに慣れていて、撮影の合間に宝石へ触れられる唯一の立場だ。","name":"真壁 誠","prior":0.2,"role":"小道具係"},{"id":"kurosawa","intro":"小道具の運搬を請け負う外部の業者。撮影所への出入りは自由だが、宝石を直接扱う立場ではない。","name":"黒沢 仁","prior":0.2,"role":"運送業者"},{"id":"ayase","intro":"クライマックスで宝石を身につけた本人。最終日の夕方、小道具部屋の前で目撃されている。","name":"綾瀬 旬","prior":0.2,"role":"主演俳優"},{"id":"okouchi","intro":"最終日の撮影順を直前に変更した張本人。宝石のシーンが後ろ倒しになり、発覚が遅れた。","name":"大河内 鉄","prior":0.2,"role":"監督"},{"id":"nikaido","intro":"衣装の出し入れで小道具部屋の鍵を借りていた。宝石の保管場所にも近づける立場だ。","name":"二階堂 梢","prior":0.2,"role":"衣装係"}],"title":"撮影最終日、消えた本物の宝石"},
{"culprit":"takano","deadline":{"minutes":160,"reason":"朝の出荷トラックが出発するまで"},"difficulty":8,"evidences":[{"id":"ev-ledger8","likelihoods":{"iwasaki":0.2,"katsuragi":0.15,"miura":0.15,"takano":0.85},"minutes":50,"name":"在庫帳簿の食い違い（再び）","text":"帳簿と実数を突き合わせると、消えた分以外にも、数か月前から少しずつ本数が合っていない。前回の事件とまったく同じ手口だ。今、帳簿を日常的に触れるのは経理の鷹野だけだ。"},{"id":"ev-method","likelihoods":{"iwasaki":0.65,"katsuragi":0.3,"miura":0.25,"takano":0.7},"minutes":30,"name":"手口を知っていた範囲","text":"前回の手口の詳しい中身——帳簿のずらし方まで知っていたのは、捜査に協力した岩崎と、当時経理で小林の部下だった鷹野だけだ。手口の再現には、その知識が要る。"},{"id":"ev-keycard8","likelihoods":{"iwasaki":0.55,"katsuragi":0.15,"miura":0.2,"takano":0.6},"minutes":30,"name":"倉庫の入退室記録","text":"犯行時刻の前後、倉庫のカード記録に残っているのは岩崎と鷹野の2人だけだった。前回と同じ顔ぶれが、記録に残っている。"},{"id":"ev-camera8","likelihoods":{"iwasaki":0.3,"katsuragi":0.25,"miura":0.35,"takano":0.75},"minutes":40,"name":"増設された正門カメラ","text":"前回の事件の後、正門にはカメラが増設されていた。その映像には、裏門方面へ向かう鷹野に似た人影があった。本人は「在庫の確認だ」と言う。"},{"id":"ev-tire8","likelihoods":{"iwasaki":0.25,"katsuragi":0.2,"miura":0.65,"takano":0.2},"minutes":30,"name":"裏門のタイヤ痕（再び）","text":"裏門の泥に、新しいタイヤ痕があった。三浦の配送トラックと型が一致する。前回の事件でも同じ痕が見つかり、同じように疑われた。だがそのトラックは毎朝、裏門から入るのが決まりだ。"},{"id":"ev-phone8","likelihoods":{"iwasaki":0.2,"katsuragi":0.2,"miura":0.3,"takano":0.7},"minutes":30,"name":"鷹野の深夜の通話履歴","text":"事件の夜、鷹野の携帯から市内の酒販ブローカーの番号へ発信があった。前回の事件で、小林が連絡していたのと同じ相手だ。本人は「前の担当者から引き継いだ番号だ」と言う。"},{"id":"ev-shift8","likelihoods":{"iwasaki":0.3,"katsuragi":0.6,"miura":0.35,"takano":0.3},"minutes":20,"name":"新しい警備員の巡回記録","text":"事件の夜、新任の警備員・葛城の巡回には1か所、記録の抜けがあった。本人は「端末の操作に慣れていなかった」と言う。"}],"id":"case-008","intro":"港の倉庫街。半年前、限定ボトル24本が消えた事件（事件3）と同じ倉庫で、再びボトルが消えた。手口は前回とそっくりで、帳簿は少しずつ、ずらされていた。前回の犯人・小林はもうここにはいない。だが手口を知る者は残っている。前回の事件の記憶は、今回の捜査の事前確率そのものだ。朝になれば出荷トラックが出てしまう。それまでに、名指ししなければならない。","solution":"犯人は経理の鷹野 涼。小林の部下だった鷹野は、手口のすべてを間近で見ていた。帳簿のずらし方も、ブローカーへの連絡先も、前任者から「引き継いで」しまったのだ。決め手は、再現された帳簿の食い違いと、同じブローカーへの通話、そして増設カメラの人影だ。タイヤ痕は前回と同じ罠——毎朝の配送の痕にすぎなかった。この事件の教訓は、連続事件では前の事件の知識が事前確率になること。ただし「前回と同じ」という思い込み自体も、証拠として数えてはいけない。","suspects":[{"id":"iwasaki","intro":"勤続20年の現場班長。前回の事件でも容疑者になり、捜査に協力した。手口の詳しい中身を知る数少ない一人。","name":"岩崎 隆","prior":0.3,"role":"倉庫の現場班長"},{"id":"miura","intro":"毎朝、港の倉庫から市内へ荷を運ぶ運転手。前回、裏門のタイヤ痕で疑われた。今回も同じ痕が見つかっている。","name":"三浦 健","prior":0.2,"role":"配送トラック運転手"},{"id":"takano","intro":"前任の小林の部下で、事件の後に経理と在庫管理を引き継いだ。帳簿の扱いは、小林仕込みだ。","name":"鷹野 涼","prior":0.3,"role":"経理・在庫管理"},{"id":"katsuragi","intro":"前回の事件の後、警備体制の強化で雇われた新しい警備員。まだ端末の操作に慣れていない。","name":"葛城 剛","prior":0.2,"role":"夜間警備員"}],"title":"港の倉庫、再び消えた限定ボトル"},
{"culprit":"shiina","deadline":{"minutes":180,"reason":"明日の朝、団体客が到着するまで"},"difficulty":9,"evidences":[{"id":"ev-sight1","likelihoods":{"kumagai":0.35,"ninomiya":0.3,"shiina":0.7,"wakami":0.3},"minutes":25,"name":"若女将の目撃証言","text":"若女将は夕方、簪が保管された棚の前で椎名を見たという。だが暗がりで、確信までは持てない、とも言う。弱い証言だ。"},{"id":"ev-sight2","likelihoods":{"kumagai":0.5,"ninomiya":0.4,"shiina":0.3,"wakami":0.4},"minutes":20,"name":"板前の証言（食い違う話）","text":"板前は「その頃、椎名は厨房の手伝いをしていたはずだ」と言う。若女将の目撃とは食い違う。どちらかが、時刻を取り違えている。"},{"id":"ev-log9","likelihoods":{"kumagai":0.3,"ninomiya":0.6,"shiina":0.45,"wakami":0.35},"minutes":30,"name":"宿泊客の出入りメモ","text":"フロントの出入りメモでは、常連客の二宮が夕方に一度、外出している。だが行き先までは書かれていない。従業員のあいだで、二宮への疑いが広がっている。"},{"id":"ev-talk9","likelihoods":{"kumagai":0.35,"ninomiya":0.35,"shiina":0.65,"wakami":0.35},"minutes":25,"name":"従業員の雑談メモ","text":"椎名は最近、実家の借金のことで電話で揉めていた、と複数の従業員が話す。金に困っていたのは確からしい。だが、それだけでは盗みの証拠にはならない。"},{"id":"ev-key9","likelihoods":{"kumagai":0.3,"ninomiya":0.3,"shiina":0.6,"wakami":0.55},"minutes":30,"name":"棚の鍵の受け渡し記録","text":"簪の棚の鍵は、その日、若女将から椎名へ一度渡されていた。若女将自身も鍵を持てる立場で、記録だけでは絞り切れない。"},{"id":"ev-bus9","likelihoods":{"kumagai":0.45,"ninomiya":0.2,"shiina":0.45,"wakami":0.45},"minutes":25,"name":"帰りのバスの目撃情報","text":"二宮の外出は、駅前の土産物屋への買い物だった。店主が見ていて、バスの時刻とも一致する。簪の棚に近づく時間はなかった。"},{"id":"ev-pawn9","likelihoods":{"kumagai":0.25,"ninomiya":0.25,"shiina":0.7,"wakami":0.25},"minutes":45,"name":"隣町の質店の話","text":"隣町の質店に、簪によく似た品が持ち込まれたという話が入った。持ち込んだ人物の人相書きは椎名に似ている。だが「似ている」止まりで、確証ではない。"},{"id":"ev-shift9","likelihoods":{"kumagai":0.5,"ninomiya":0.35,"shiina":0.65,"wakami":0.35},"minutes":30,"name":"勤務シフトの空白","text":"椎名のシフトには、夕方に40分ほどの空白がある。本人は「休憩だ」と言うが、休憩室にいたのを見た者はいない。板前の証言の「厨房にいたはず」は、この空白と重ならない。"}],"id":"case-009","intro":"山あいの温泉旅館「湯守の宿」。先代女将の形見の簪が、保管棚から消えた。困ったことに、この事件には決定的な物証がない。残っているのは、人の証言と、書き残された記録ばかり。どれも単独では弱く、食い違う話まである。容疑者は4人。明日の朝、団体客が到着すれば、宿は通常営業に戻らなければならない。それまでに、弱い手がかりを積み重ねて名指ししなければならない。","solution":"犯人は仲居の椎名 遥。決め手になった証拠は一つもない。若女将の目撃、鍵の受け渡し、借金の話、質店の人相書き、シフトの空白——どれも単独では椎名を50%前後までしか押し上げない。だが、出どころの違う弱い証拠が5つ、同じ一人を指したとき、確率は90%を超えた。板前の証言は時刻の取り違えで、シフトの空白と重なると崩れる。二宮の外出には、土産物屋という裏づけがあった。この事件の教訓は、ベイズの真骨頂は「弱い証拠の積み重ね」だということ。ただし、出どころが同じ話を二重に数えてはいけない。","suspects":[{"id":"wakami","intro":"宿を切り盛りする若女将。形見の簪の保管責任者で、鍵を持ち、棚にも近づける。","name":"湯守 栞","prior":0.25,"role":"若女将"},{"id":"kumagai","intro":"長年この宿に勤める板前。椎名をかばうような証言をしたが、時刻が合っていない。","name":"熊谷 大悟","prior":0.25,"role":"板前"},{"id":"shiina","intro":"勤めて2年の仲居。実家の借金の話が知られていて、従業員のあいだで囁かれている。","name":"椎名 遥","prior":0.25,"role":"仲居"},{"id":"ninomiya","intro":"毎年この宿に泊まる常連。夕方に外出していたことから、従業員に疑われている。","name":"二宮 進","prior":0.25,"role":"常連の宿泊客"}],"title":"湯けむりの宿、消えた形見の簪"},
{"culprit":["seto","kakinuma"],"deadline":{"minutes":170,"reason":"朝、店の周年広告が新聞に載るまで"},"difficulty":10,"evidences":[{"id":"ev-argue10","likelihoods":{"kakinuma":0.3,"master":0.3,"seto":0.3,"takagi":0.7,"utada":0.3},"minutes":20,"name":"高木の口論（再び）","text":"その夜、高木は会計のことで店ともめていた。事件1のときと同じ光景に、店内は「また高木か」という空気になっている。"},{"id":"ev-witness10","likelihoods":{"kakinuma":0.35,"master":0.65,"seto":0.3,"takagi":0.3,"utada":0.3},"minutes":25,"name":"常連の目撃証言","text":"常連の一人が「閉店間際、マスターが裏口で誰かと話していた」と証言した。だが、その常連はその夜、かなり酒が入っていた。"},{"id":"ev-drunk10","likelihoods":{"kakinuma":0.45,"master":0.2,"seto":0.45,"takagi":0.45,"utada":0.45},"minutes":20,"name":"目撃者の酔いの確認","text":"目撃者の常連は、証言の時刻には既に泥酔に近かったことが、他の客の話とレシートの本数から分かる。裏口で見た「マスター」は、背格好の似た別の誰かだった可能性が高い。"},{"id":"ev-call10","likelihoods":{"kakinuma":0.85,"master":0.25,"seto":0.85,"takagi":0.2,"utada":0.25},"minutes":30,"name":"瀬戸と柿沼の連絡履歴","text":"この1か月、見習いの瀬戸と、半年前に辞めた元従業員の柿沼が、深夜に何度も連絡を取り合っていた。辞めた店員と現役の見習いが、深夜に話す用事は見当たらない。"},{"id":"ev-key10","likelihoods":{"kakinuma":0.5,"master":0.4,"seto":0.8,"takagi":0.2,"utada":0.2},"minutes":35,"name":"裏口の合鍵の複製記録","text":"裏口の鍵は、1か月前に市内の鍵店で1本複製されていた。複製の依頼者は伏せられているが、鍵を預かれる立場だったのはマスターと、鍵番を任されていた瀬戸だけだ。"},{"id":"ev-watch10","likelihoods":{"kakinuma":0.85,"master":0.2,"seto":0.55,"takagi":0.2,"utada":0.2},"minutes":40,"name":"質店に出た預かり時計","text":"消えた常連の預かり時計が、市内の質店に出ていた。持ち込んだのは柿沼だ。本人は「知人から預かっただけだ」と言うが、知人の名は出てこない。"},{"id":"ev-shift10","likelihoods":{"kakinuma":0.3,"master":0.3,"seto":0.75,"takagi":0.3,"utada":0.3},"minutes":25,"name":"瀬戸のシフトの空白","text":"事件の夜、瀬戸には30分ほど持ち場を離れた時間がある。「氷を取りに行っていた」と言うが、製氷室の記録と合わない。"},{"id":"ev-money10","likelihoods":{"kakinuma":0.75,"master":0.3,"seto":0.35,"takagi":0.3,"utada":0.3},"minutes":25,"name":"柿沼の借金返済","text":"柿沼は事件の翌日、滞っていた借金を現金でまとめて返済していた。辞めてから収入の当てがないはずの男だ。"},{"id":"ev-alibi10","likelihoods":{"kakinuma":0.45,"master":0.45,"seto":0.45,"takagi":0.1,"utada":0.45},"minutes":30,"name":"高木のアリバイ","text":"事件の時刻、高木は向かいのカラオケ店にいた。入店記録と、店員の証言が一致する。口論のあと店を出て、そのままカラオケにいたのだ。"}],"id":"case-010","intro":"バー「灯」の開店1周年の夜（事件1と同じ店だ）。常連から預かっていた高価な腕時計と、その夜の売上金が消えた。裏口の鍵と店の段取りを知らなければ成り立たない手口で、犯行は内部に通じた者と外の者の2人組とみられる。常連の高木は、事件1のときと同じように、その夜も店ともめていた。朝になれば周年の広告が新聞に載り、店の評判は地に落ちる。それまでに、2人を名指ししなければならない。","solution":"犯人はバーテンダー見習いの瀬戸 蓮と、元従業員の柿沼 豪。瀬戸が合鍵を複製して柿沼に渡し、持ち場を離れた隙に柿沼が裏口から入って時計と売上金を持ち出した。決め手は、2人の深夜の連絡履歴という「つながり」と、質店に出た時計だ。マスターへの目撃証言は、泥酔した常連の人違いだった。高木は今回も一番怪しく見えたが、アリバイは本物だった——事件1で学んだはずの構図が、ここでも繰り返された。シーズン2の教訓は全部ここにある。証言は裏を取り、共犯はつながりを追い、過去の事件の記憶は事前確率としてだけ使うこと。","suspects":[{"id":"takagi","intro":"事件1でも疑われた常連。その夜も会計で店ともめていて、真っ先に疑われている。","name":"高木 淳","prior":0.35,"role":"常連客"},{"id":"master","intro":"店の主人。裏口で誰かと話していた、と泥酔した常連に証言されている。","name":"灯 真司","prior":0.15,"role":"店主（マスター）"},{"id":"seto","intro":"勤めて半年の見習い。鍵番を任されていて、裏口の鍵を預かれる立場だ。","name":"瀬戸 蓮","prior":0.2,"role":"バーテンダー見習い"},{"id":"kakinuma","intro":"半年前に辞めた元従業員。店の段取りと裏口の場所を知っている。今は定職がない。","name":"柿沼 豪","prior":0.15,"role":"元従業員"},{"id":"utada","intro":"周年イベントで歌った常連の歌手。預かり時計の持ち主の友人でもある。","name":"宇多 美咲","prior":0.15,"role":"常連の歌手"}],"title":"一周年の夜、消えた預かり時計"},
{"culprit":"kashiwagi","deadline":{"minutes":150,"reason":"明朝の開館まで"},"difficulty":11,"evidences":[{"id":"ev-card11","likelihoods":{"hase":0.4,"kashiwagi":0.5,"nire":0.6,"tojo":0.5},"minutes":20,"name":"入館記録","text":"閉館時刻の前後に入館証を使ったのは全員だ。誰の可能性もほとんど下がらない。情報量の小さい記録だ。"},{"id":"ev-cam11","likelihoods":{"hase":0.25,"kashiwagi":0.6,"nire":0.25,"tojo":0.6},"minutes":35,"name":"書庫のカメラ映像","text":"書庫のカメラには、閉館後に人影が2度映っていた。背格好から、容疑者は柏木と東条のどちらかまでには絞れる。だが顔は映っておらず、2人のあいだは割れない。"},{"id":"ev-cat11","likelihoods":{"hase":0.2,"kashiwagi":0.8,"nire":0.2,"tojo":0.3},"minutes":30,"name":"貴重書の貸出カード","text":"消えた貴重書の貸出カードには、閉館間際の時刻で柏木の処理印があった。本人は「返却処理をしただけだ」と言う。"},{"id":"ev-memo11","likelihoods":{"hase":0.3,"kashiwagi":0.35,"nire":0.3,"tojo":0.65},"minutes":25,"name":"主任の誤納メモ","text":"東条の机には、貴重書の配架ミスを詫びるメモの下書きがあった。隠れて何かをしていたようにも見える。だが中身は、ただの事務ミスの始末書だった。"},{"id":"ev-glove11","likelihoods":{"hase":0.35,"kashiwagi":0.7,"nire":0.3,"tojo":0.25},"minutes":25,"name":"書架の手袋の跡","text":"貴重書の棚には、保存用の白手袋の繊維が残っていた。手袋を使うのは司書の2人で、サイズは柏木のものと合う。"},{"id":"ev-key11","likelihoods":{"hase":0.3,"kashiwagi":0.75,"nire":0.15,"tojo":0.4},"minutes":30,"name":"書庫の鍵の使用記録","text":"閉館後に書庫の鍵が使われたのは1回だけ。その時間帯に鍵を借りていたのは柏木だ。東条は鍵を持っていたが、使った記録はない。"},{"id":"ev-sale11","likelihoods":{"hase":0.15,"kashiwagi":0.85,"nire":0.2,"tojo":0.15},"minutes":40,"name":"ネット出品の痕跡","text":"古書の出品サイトに、消えた貴重書と同版の本が匿名で出品されていた。出品アカウントの登録メールの一部は、柏木のものと一致する。"}],"id":"case-011","intro":"市立図書館の閉館後、書庫の貴重書が1冊消えた。容疑者は4人、最初の手がかりはゼロ——不確実さは最大の 2.00 bit（ビット： 不確実さの単位）だ。シーズン3・情報理論編では、確率そのものに加えて「あいまいさがどれだけ減ったか」を追う。証拠の価値は情報量で決まる。見た目が派手でも、容疑者を半々に割るだけの証拠は少ししか減らさない。明朝の開館までに、不確実さを名指しできる水準まで削らなければならない。","solution":"犯人は司書補助の柏木 葵。貸出カードの処理印、鍵の使用記録、出品アカウントの痕跡が、同じ一人を指した。カメラ映像は派手だったが、柏木と東条を半々に割るだけで、情報量は 0.12 bit しかなかった。逆に地味な鍵の記録は、分布を一気に鋭くした。この事件の教訓は、証拠の価値は「情報量」で測るものだということ。あいまいさをどれだけ減らしたかで証拠を選べば、限られた時間でも確信に届く。","suspects":[{"id":"kashiwagi","intro":"貴重書の返却処理を担当する司書補助。閉館間際まで書庫にいた。","name":"柏木 葵","prior":0.25,"role":"司書補助"},{"id":"tojo","intro":"書庫の管理責任者。配架ミスの始末書を書いていて、挙動を疑われている。","name":"東条 守","prior":0.25,"role":"司書（主任）"},{"id":"nire","intro":"貴重書の閲覧を申請していた研究者。閉館まで閲覧室にいた。","name":"楡 健太","prior":0.25,"role":"利用者（郷土史の研究者）"},{"id":"hase","intro":"閉館後の清掃を担当。書庫の前を通る動線を持っている。","name":"長谷 泉","prior":0.25,"role":"清掃スタッフ"}],"system":"entropy","title":"閉館後、消えた貴重書"},

];

// ===== セーブ（端末の localStorage） =====
const SAVE_KEY = "probably-save-v1";
const loadSave = () => { try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || { best: {} }; } catch (e) { return { best: {} }; } };
const storeSave = (s) => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {} };

// ===== 状態 =====
let cur = null; // { case, got:Set, used:number, probs:{} }

const $ = (id) => document.getElementById(id);
const show = (id) => { document.querySelectorAll(".screen").forEach(el => el.classList.remove("on")); $(id).classList.add("on"); window.scrollTo(0, 0); };
const pct = (v) => (v * 100).toFixed(1) + "%";

// ベイズ更新： 事前確率 × 集めた証拠の尤度 → 正規化
function computeProbs(c, got) {
  const w = {};
  for (const s of c.suspects) {
    w[s.id] = s.prior;
    for (const ev of c.evidences) if (got.has(ev.id)) w[s.id] *= ev.likelihoods[s.id];
  }
  const sum = Object.values(w).reduce((a, b) => a + b, 0);
  const p = {};
  for (const s of c.suspects) p[s.id] = w[s.id] / sum;
  return p;
}
const topId = (c, p) => c.suspects.reduce((a, b) => (p[a.id] >= p[b.id] ? a : b)).id;
// 情報理論編： 分布のエントロピー（不確実さ、単位 bit）
function entropyOf(p) { let h = 0; for (const id in p) { if (p[id] > 0) h -= p[id] * Math.log2(p[id]); } return h; }

// ===== 事件選択 =====
function renderCases() {
  const save = loadSave();
  const list = $("case-list");
  list.innerHTML = "";
  CASES.forEach((c, i) => {
    const b = document.createElement("button");
    const best = save.best[c.id];
    const unlocked = i === 0 || !!save.best[CASES[i - 1].id];
    if (!unlocked) {
      b.disabled = true;
      b.textContent = `事件${c.difficulty}「${c.title}」（事件${CASES[i - 1].difficulty}を解決すると開く）`;
    } else {
      b.textContent = `事件${c.difficulty}「${c.title}」` + (best ? `　―　ベスト ${best.score}点（ランク${best.rank}）` : "");
      b.addEventListener("click", () => startCase(c));
    }
    list.appendChild(b);
  });
  const note = document.createElement("div");
  note.className = "sub";
  note.style.marginTop = "12px";
  note.textContent = "全18件が出揃った。ベイズ編・情報理論編・ゲーム理論編、ベストスコア更新に挑戦できる。";
  list.appendChild(note);
}

// ===== 調査 =====
function startCase(c) {
  cur = { case: c, got: new Set(), used: 0, probs: computeProbs(c, new Set()), gains: {} };
  cur.h0 = entropyOf(cur.probs);
  renderPlay();
  show("scr-play");
}
function renderPlay() {
  const c = cur.case;
  const left = c.deadline.minutes - cur.used;
  $("play-title").textContent = `事件${c.difficulty}「${c.title}」`;
  $("deadline-reason").textContent = "期限： " + c.deadline.reason;
  const t = $("time-left");
  t.textContent = `残り ${left} 分`;
  t.className = "time" + (left <= 30 ? " low" : "");
  $("time-fill").style.width = (left / c.deadline.minutes * 100) + "%";
  const erow = $("entropy-row");
  if (c.system === "entropy") {
    const h = entropyOf(cur.probs);
    erow.style.display = "";
    $("entropy-val").textContent = h.toFixed(2) + " bit";
    $("entropy-fill").style.width = (cur.h0 > 0 ? h / cur.h0 * 100 : 0) + "%";
  } else {
    erow.style.display = "none";
  }
  $("play-intro").textContent = c.intro;
  renderSuspects($("suspects"), c, cur.probs);
  const box = $("evidences");
  box.innerHTML = "";
  for (const ev of c.evidences) {
    if (cur.got.has(ev.id)) {
      const d = document.createElement("div");
      d.className = "ev-got";
      d.innerHTML = "";
      const n = document.createElement("div"); n.className = "ev-name"; n.textContent = "✓ " + ev.name;
      const tx = document.createElement("div"); tx.className = "ev-text"; tx.textContent = ev.text;
      d.appendChild(n); d.appendChild(tx);
      if (c.system === "entropy" && cur.gains[ev.id] !== undefined) {
        const g = document.createElement("div"); g.className = "ev-gain";
        g.textContent = `情報量： この証拠で不確実さが ${cur.gains[ev.id].toFixed(2)} bit 減った`;
        d.appendChild(g);
      }
      if (c.system === "game" && ev.note) {
        const g = document.createElement("div"); g.className = "ev-gain";
        g.textContent = "利害の読み： " + ev.note;
        d.appendChild(g);
      }
      box.appendChild(d);
    } else {
      const b = document.createElement("button");
      b.textContent = `${ev.name}（${ev.minutes}分）`;
      if (ev.minutes > left) { b.disabled = true; b.textContent = `${ev.name}（${ev.minutes}分 ― 時間が足りない）`; }
      b.addEventListener("click", () => {
        const hBefore = c.system === "entropy" ? entropyOf(cur.probs) : 0;
        cur.got.add(ev.id);
        cur.used += ev.minutes;
        cur.probs = computeProbs(c, cur.got);
        if (c.system === "entropy") cur.gains[ev.id] = hBefore - entropyOf(cur.probs);
        renderPlay();
      });
      box.appendChild(b);
    }
  }
}
function renderSuspects(box, c, p) {
  box.innerHTML = "";
  const top = topId(c, p);
  for (const s of c.suspects) {
    const d = document.createElement("div");
    d.className = "suspect" + (s.id === top ? " top" : "");
    const row = document.createElement("div"); row.className = "row";
    const nm = document.createElement("span");
    const nameSpan = document.createElement("span"); nameSpan.className = "name"; nameSpan.textContent = s.name;
    const roleSpan = document.createElement("span"); roleSpan.className = "role"; roleSpan.textContent = s.role;
    nm.appendChild(nameSpan); nm.appendChild(roleSpan);
    const pc = document.createElement("span"); pc.className = "pct"; pc.textContent = pct(p[s.id]);
    row.appendChild(nm); row.appendChild(pc);
    const bar = document.createElement("div"); bar.className = "bar";
    const fill = document.createElement("div"); fill.style.width = (p[s.id] * 100) + "%";
    bar.appendChild(fill);
    const intro = document.createElement("div"); intro.className = "intro-s"; intro.textContent = s.intro;
    d.appendChild(row); d.appendChild(bar); d.appendChild(intro);
    box.appendChild(d);
  }
}

// ===== 名指し =====
function renderAccuse() {
  const c = cur.case;
  const list = $("accuse-list");
  list.innerHTML = "";
  if (Array.isArray(c.culprit)) {
    // 共犯ケース： 2人を選んでから確定する
    const note = document.createElement("div");
    note.className = "sub";
    note.textContent = "この事件の犯人は2人。2人を選んでから名指しする。";
    list.appendChild(note);
    const sel = new Set();
    const confirm = document.createElement("button");
    confirm.textContent = "この2人を名指しする";
    confirm.disabled = true;
    confirm.style.marginTop = "10px";
    for (const s of c.suspects) {
      const b = document.createElement("button");
      b.textContent = `${s.name}（${s.role}） ― 現在 ${pct(cur.probs[s.id])}`;
      b.addEventListener("click", () => {
        if (sel.has(s.id)) { sel.delete(s.id); b.classList.remove("selected"); }
        else if (sel.size < 2) { sel.add(s.id); b.classList.add("selected"); }
        confirm.disabled = sel.size !== 2;
      });
      list.appendChild(b);
    }
    confirm.addEventListener("click", () => finish([...sel]));
    list.appendChild(confirm);
  } else {
    for (const s of c.suspects) {
      const b = document.createElement("button");
      b.textContent = `${s.name}（${s.role}） ― 現在 ${pct(cur.probs[s.id])}`;
      b.addEventListener("click", () => finish(s.id));
      list.appendChild(b);
    }
  }
  show("scr-accuse");
}

// ===== 結果と評価（v0.1 暫定値： 基礎点＝名指し時の確率、速さボーナス＝残り時間の割合×20点） =====
function rankOf(score) { return score >= 100 ? "S" : score >= 85 ? "A" : score >= 65 ? "B" : "C"; }
function finish(accused) {
  const c = cur.case;
  const p = cur.probs;
  const left = c.deadline.minutes - cur.used;
  const isPair = Array.isArray(c.culprit);
  const ok = isPair
    ? (Array.isArray(accused) && accused.length === c.culprit.length && c.culprit.every(id => accused.includes(id)))
    : accused === c.culprit;
  const accusedProb = isPair ? Math.min(1, p[accused[0]] + p[accused[1]]) : p[accused];
  const head = $("result-head");
  const text = $("result-text");
  const box = $("scorebox");
  renderSuspects($("result-suspects"), c, p);
  if (ok) {
    const base = Math.round(accusedProb * 1000) / 10;
    const bonus = Math.round(left / c.deadline.minutes * 20);
    const score = Math.round((base + bonus) * 10) / 10;
    const rank = rankOf(score);
    head.textContent = "名指しは正しかった";
    head.className = "result-head ok";
    text.textContent = c.solution;
    box.innerHTML = "";
    const l1 = document.createElement("div"); l1.textContent = isPair ? `基礎点（2人の確率の合計）： ${base} 点` : `基礎点（名指し時の確率）： ${base} 点`;
    const l2 = document.createElement("div"); l2.textContent = `速さボーナス（残り ${left} 分）： +${bonus} 点`;
    const l3 = document.createElement("div"); l3.textContent = `合計： ${score} 点`;
    const l4 = document.createElement("div"); l4.innerHTML = `ランク： <span class="rank">${rank}</span>`;
    box.appendChild(l1); box.appendChild(l2); box.appendChild(l3); box.appendChild(l4);
    const save = loadSave();
    const prev = save.best[c.id];
    if (!prev || score > prev.score) { save.best[c.id] = { score, rank }; storeSave(save); }
    if (c.system === "entropy") {
      const hEnd = entropyOf(p);
      const li = document.createElement("div");
      li.textContent = `集めた情報量： 合計 ${(cur.h0 - hEnd).toFixed(2)} bit（不確実さ ${cur.h0.toFixed(2)} → ${hEnd.toFixed(2)} bit）`;
      box.appendChild(li);
    }
    const bestNote = document.createElement("div");
    bestNote.className = "best";
    bestNote.textContent = `この事件のベスト： ${save.best[c.id].score} 点（ランク${save.best[c.id].rank}）`;
    box.appendChild(bestNote);
  } else {
    head.textContent = isPair ? "誤認 ― その組み合わせではなかった" : "誤認 ― その人は犯人ではなかった";
    head.className = "result-head ng";
    text.textContent = isPair
      ? `名指しした2人の確率の合計は ${pct(accusedProb)} だった。共犯の事件では、片方だけ当たっていても解決にはならない。事件は失敗として記録される。もう一度、証拠の集め方からやり直そう。`
      : `名指しした相手の確率は ${pct(accusedProb)} だった。確率が低いうちの名指しは、冤罪の危険と隣り合わせだ。事件は失敗として記録される。もう一度、証拠の集め方からやり直そう。`;
    box.innerHTML = "";
    const l1 = document.createElement("div"); l1.textContent = "スコア： 0 点（誤認のため記録なし）";
    box.appendChild(l1);
  }
  show("scr-result");
}

// ===== 画面遷移 =====
$("btn-start").addEventListener("click", () => { renderCases(); show("scr-cases"); });
$("btn-to-title").addEventListener("click", () => show("scr-title"));
$("btn-accuse").addEventListener("click", renderAccuse);
$("btn-back-play").addEventListener("click", () => show("scr-play"));
$("btn-quit").addEventListener("click", () => { renderCases(); show("scr-cases"); });
$("btn-to-cases").addEventListener("click", () => { renderCases(); show("scr-cases"); });
$("btn-retry").addEventListener("click", () => startCase(cur.case));
</script>
